# ICS Environment Asset Configuration
# Defines hosts, network zones, services, and data sources for provenance analysis
#

hosts:
  SCADA-01:
    hostname: SCADA-01
    ip_address: 192.168.42.20
    role: SCADA Server
    zone: Supervisory
    has_logs: true
    description: Primary SCADA server running Ignition Gateway for supervisory control and monitoring
    os: Windows Server 2022 Standard
  EWS-WIN-01:
    hostname: EWS-WIN-01
    ip_address: 192.168.42.12
    role: Engineering Workstation
    zone: Supervisory
    has_logs: true
    description: Engineering workstation for ICS configuration and maintenance
    os: Windows Server 2012 R2 Standard
  HMI-01:
    hostname: HMI-01
    ip_address: 192.168.42.21
    role: HMI Workstation
    zone: Supervisory
    has_logs: true
    description: Human-Machine Interface workstation for operator control and visualization
    os: Windows Server 2022 Standard
  HISTORIAN-01:
    hostname: HISTORIAN-01
    ip_address: 192.168.42.22
    role: Historian Server
    zone: Supervisory
    has_logs: false
    description: Historical data collection and storage server for process data
    os: Linux Ubuntu 18.04
  DMZ-WIN-01:
    hostname: DMZ-WIN-01
    ip_address: 172.16.142.11
    role: DMZ Gateway
    zone: DMZ
    has_logs: true
    description: Demilitarized zone server providing secure external access to ICS network
    os: Windows Server 2012 R2 Standard
  CWS-WIN-01:
    hostname: CWS-WIN-01
    ip_address: 192.168.40.12
    role: Corporate Workstation
    zone: Corporate
    has_logs: true
    description: Corporate network workstation for business operations
    os: Windows Server 2012 R2 Standard
  DNS-01:
    hostname: DNS-01
    ip_address: 192.168.40.211
    role: DNS Server
    zone: Corporate
    has_logs: false
    description: Domain Name System server for corporate network
    os: Windows Server 2012 R2 Standard
  PLC-01:
    hostname: PLC-01
    ip_address: 192.168.43.9
    role: PLC
    zone: Field
    has_logs: false
    description: Programmable Logic Controller for field device control
    os: Embedded Linux
  PLC-02:
    hostname: PLC-02
    ip_address: 192.168.43.10
    role: PLC
    zone: Field
    has_logs: false
    description: Programmable Logic Controller for field device control
    os: Embedded Linux
  PLC-03:
    hostname: PLC-03
    ip_addresses:
      - 192.168.43.11  # Field network
      - 192.168.44.11  # Secondary network
    role: PLC
    zone: Field
    has_logs: false
    description: Programmable Logic Controller for field device control
    os: Embedded Linux

  FT-PLC-01:
    hostname: FT-PLC-01
    ip_address: 192.168.0.1
    role: PLC
    zone: Fishertechnik
    has_logs: false
    is_managed: false
    description: Fishertechnik PLC providing OPC UA (4840) and S7 (102) services
    os: Embedded
  FT-GW-01:
    hostname: FT-GW-01
    ip_address: 192.168.0.5
    role: Gateway
    zone: Fishertechnik
    has_logs: false
    is_managed: false
    description: Fishertechnik gateway providing Node-RED, Grafana, SSH, and web services
    os: Embedded Linux
  FT-MQTT-01:
    hostname: FT-MQTT-01
    ip_address: 192.168.0.10
    role: Controller
    zone: Fishertechnik
    has_logs: false
    is_managed: false
    description: Fishertechnik MQTT broker (port 1883)
    os: Embedded
  FT-CLIENT-01:
    hostname: FT-CLIENT-01
    ip_address: 192.168.0.12
    role: HMI
    zone: Fishertechnik
    has_logs: false
    is_managed: false
    description: Fishertechnik client device
    os: Unknown
  FT-ROUTER:
    hostname: FT-ROUTER
    ip_address: 192.168.0.252
    role: Network Infrastructure
    zone: Fishertechnik
    has_logs: false
    is_managed: false
    description: Fishertechnik network router providing DNS, DHCP, and NTP
    os: Embedded

# Network zone definitions
zones:
  Corporate:
    name: Corporate Network
    description: Enterprise subnet for business workstations and corporate servers
    subnet: 192.168.40.0/24
  Supervisory:
    name: Supervisory Control Network
    description: Control network subnet for SCADA, HMI, Historian, and engineering systems
    subnet: 192.168.42.0/24
  Field:
    name: Field Controller Network
    description: Process control subnet for field devices including PLCs and RTUs
    subnet: 192.168.43.0/24
  DMZ:
    name: Demilitarized Zone
    description: Security buffer zone between external networks and ICS infrastructure
    subnet: 172.16.142.0/24
  Fishertechnik:
    name: Fishertechnik Process Network
    description: Fishertechnik factory model network with PLCs, MQTT brokers, and HMI devices
    subnet: 192.168.0.0/24
