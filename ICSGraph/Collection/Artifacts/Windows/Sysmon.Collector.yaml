name: Custom.Windows.Sysmon.Collector
description: |
   This is the human readable description of the artifact.

# Can be CLIENT, CLIENT_EVENT, SERVER, SERVER_EVENT or NOTEBOOK
type: CLIENT

sources:
  - precondition:
      SELECT OS From info() where OS = 'windows'

    query: |
      LET RawEvent = SELECT
        EventData.UtcTime AS TimeStamp,
        System.ID AS EID,
        EventData
      FROM watch_etw(
        guid="{5770385f-c22a-43e0-bf4c-06f5698ffbd9}")

      SELECT "Sysmon" AS Source,
            TimeStamp,
            EID,
            EventData
      FROM RawEvent